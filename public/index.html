<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFCFC">
<title>Verdant — Track, reduce, offset all commutes</title>
<meta name="description" content="Verdant helps teams track, reduce and offset the carbon footprint of every commute.">
<style>
@font-face{font-family:"DM Sans V";src:url(assets/font-01.woff2) format("woff2");font-weight:100 1000;font-style:normal;font-display:block}

/* ---------- tokens (sampled from the reference) ---------- */
:root{
  --page:#FBFCFC; --nav:#F3F4F4; --ink:#060606; --link:#0B0B0B;
  --btn:#221E1D; --btn-ink:#F9F8F9; --light:#FDFDFE; --light-ink:#111111;
  --white:#FCFCFC; --sub:#F9FAF2;
  --glass:rgba(85,88,35,.8); --glass-rim:rgba(255,255,255,.10);
  --thumb:#F4F6F0; --thumb-tint:#F5F6F2;
  /* desktop unit: 1 reference px. Scales with the viewport; never wider than the
     width allows, height-driven otherwise, floored so short landscape stays legible. */
  --u:min(calc(100vw / 1568), max(calc(100vh / 1003), .5px));
}
@supports (height:100dvh){:root{--u:min(calc(100vw / 1568), max(calc(100dvh / 1003), .5px))}}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
body{font-family:"DM Sans V","DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;
  color:var(--ink);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,p{margin:0;font-weight:inherit}
svg{display:block}
:focus-visible{outline:2px solid #9BB33A;outline-offset:3px}

/* ---------- page shell: always exactly one viewport tall, no dead space ---------- */
.page{display:flex;flex-direction:column;gap:calc(17*var(--u));
  height:100vh;height:100dvh;min-height:calc(620*var(--u));
  padding:calc(12*var(--u)) calc(16.5*var(--u)) calc(16.5*var(--u));
  padding-left:max(calc(16.5*var(--u)),env(safe-area-inset-left));padding-right:max(calc(16.5*var(--u)),env(safe-area-inset-right))}

/* ---------- nav ---------- */
.nav{position:relative;flex:none;height:calc(73*var(--u));background:var(--nav);border-radius:calc(10*var(--u));z-index:5}
.logo{position:absolute;left:calc(21.5*var(--u));top:calc(23*var(--u));color:var(--ink)}
.logo{translate:calc(.5*var(--u)) 0}
.logo-svg{width:calc(155*var(--u));height:auto;fill:currentColor;overflow:visible}
.logo-svg path{stroke:currentColor;stroke-width:.1px;stroke-linejoin:round}
.logo-svg path:last-child{stroke-width:.5px;transform-box:fill-box;transform-origin:center;scale:.97}
.logo-svg circle{stroke-width:2.7px}
.links{position:absolute;left:50%;top:calc(28.4*var(--u));transform:translateX(calc(-50% + 0.75*var(--u)));
  display:flex;gap:calc(34*var(--u));
  font-size:calc(21.0*var(--u));line-height:1;font-weight:450;font-variation-settings:"opsz" 24;letter-spacing:calc(-0.4*var(--u));color:var(--link);white-space:nowrap}
.links a{transition:opacity .2s}
.links a:nth-child(2){translate:calc(-1.25*var(--u)) 0}.links a:nth-child(3){translate:calc(0.25*var(--u)) 0}
.links a:hover{opacity:.6}
.links-cta{display:none}

/* split button: a pill + an icon block fused by a narrow bridge */
.split{position:absolute;display:flex;align-items:stretch;white-space:nowrap}
.split-main,.split-icon{display:flex;align-items:center;justify-content:center;background:var(--sb);color:var(--sc);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.split-bridge{background:var(--sb);flex:none}
.split--dark{--sb:var(--btn);--sc:var(--btn-ink)}
.split--light{--sb:var(--light);--sc:var(--light-ink)}
.split:hover .split-icon svg{transform:translateX(calc(2*var(--u)))}
.split-icon svg{transition:transform .25s cubic-bezier(.2,.7,.2,1)}

.cta{right:calc(16*var(--u));top:calc(12.8*var(--u));height:calc(48*var(--u));
  font-size:calc(19*var(--u));line-height:1;font-weight:450;font-variation-settings:"opsz" 24;letter-spacing:calc(-0.15*var(--u))}
.cta .split-main{width:calc(184.4*var(--u));padding-top:calc(0.5*var(--u));padding-right:calc(2*var(--u));border-radius:calc(7*var(--u))}
.cta .split-bridge{width:calc(2.2*var(--u));margin:calc(12.2*var(--u)) 0 calc(11.8*var(--u))}
.cta .split-icon{width:calc(48*var(--u));border-radius:calc(7*var(--u))}
.ico-nav{width:calc(17*var(--u));translate:0 calc(1*var(--u))}
.menu{display:none}

/* ---------- hero ---------- */
.hero{position:relative;flex:1 1 auto;min-height:0;border-radius:calc(10*var(--u));overflow:hidden;isolation:isolate;
  background:#7d8a52;container-type:size;color:var(--white)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;z-index:-2;filter:saturate(1.27) brightness(1.01);user-select:none;-webkit-user-drag:none}
.hero-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,.12) 100%)}

.hero-top{position:absolute;left:0;top:0;right:0}
.headline{position:absolute;left:calc(20.4*var(--u));top:calc(158.9*var(--u));
  font-size:calc(72.1*var(--u));line-height:calc(76*var(--u));font-weight:365;font-variation-settings:"opsz" 22;
  letter-spacing:calc(-2.1*var(--u));white-space:nowrap}
.headline span{display:block}
.headline span:nth-child(2){translate:calc(2.0*var(--u)) calc(1.2*var(--u));letter-spacing:calc(-1.95*var(--u))}

.demo{position:absolute;left:calc(22*var(--u));top:calc(357.15*var(--u));display:flex;align-items:center;
  font-size:calc(21.8*var(--u));line-height:1;font-weight:400;font-variation-settings:"opsz" 14;letter-spacing:calc(-0.56*var(--u))}
.demo::after{content:"";position:absolute;left:calc(0.5*var(--u));top:calc(33.4*var(--u));width:calc(163*var(--u));height:calc(1.9*var(--u));
  background:rgba(255,255,255,.93);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.demo:hover::after{transform:scaleX(.82)}
.ico-demo{width:calc(18*var(--u));margin-left:calc(18*var(--u));translate:0 calc(1.0*var(--u));transition:transform .25s}
.demo:hover .ico-demo{transform:translateX(calc(3*var(--u)))}

/* bottom group: anchored to the hero's bottom edge so it never floats */
.hero-bottom{position:absolute;inset:0;pointer-events:none}
.hero-bottom>*{pointer-events:auto}

/* glass card */
.card{position:absolute;left:calc(20.8*var(--u));bottom:calc(66*var(--u));width:calc(406.2*var(--u));height:calc(150.7*var(--u));
  border-radius:calc(10*var(--u));background:var(--glass);
  -webkit-backdrop-filter:blur(calc(22*var(--u))) saturate(2.8) brightness(.95);backdrop-filter:blur(calc(22*var(--u))) saturate(2.8) brightness(.95);
  box-shadow:inset 0 0 0 calc(1*var(--u)) var(--glass-rim)}
.thumb{position:absolute;left:calc(13.2*var(--u));top:calc(13.7*var(--u));width:calc(131*var(--u));height:calc(122.2*var(--u));
  border-radius:calc(7*var(--u));overflow:hidden;background:var(--thumb);isolation:isolate;box-shadow:inset 0 0 0 calc(1*var(--u)) rgba(255,255,255,.45)}
.thumb img{position:absolute;left:calc(7*var(--u));top:calc(5.5*var(--u));width:calc(117.3*var(--u));height:auto}
.thumb::before{content:"";position:absolute;left:20%;right:18%;top:calc(96.5*var(--u));height:calc(14*var(--u));z-index:1;pointer-events:none;
  background:radial-gradient(closest-side,var(--thumb) 55%,rgba(244,246,240,0) 100%)}
.thumb::after{z-index:2;content:"";position:absolute;inset:0;background:var(--thumb-tint);mix-blend-mode:multiply;pointer-events:none}
.card-body{position:absolute;left:calc(167.5*var(--u));top:0;right:0;bottom:0}
.card-title{position:absolute;left:calc(-.1*var(--u));top:calc(23.73*var(--u));font-size:calc(18.0*var(--u));line-height:1;
  font-weight:450;font-variation-settings:"opsz" 14;letter-spacing:calc(-0.6*var(--u));color:var(--white);white-space:nowrap}
.card-sub{position:absolute;left:calc(-1.0*var(--u));top:calc(54.92*var(--u));font-size:calc(12.6*var(--u));line-height:1;
  font-weight:475;font-variation-settings:"opsz" 14;letter-spacing:calc(0*var(--u));color:var(--sub);white-space:nowrap}
.try{left:calc(-1*var(--u));top:calc(92*var(--u));height:calc(37.8*var(--u));
  font-size:calc(14.4*var(--u));line-height:1;font-weight:500;font-variation-settings:"opsz" 9;letter-spacing:calc(-0.36*var(--u))}
.try .split-main{width:calc(85.6*var(--u));justify-content:flex-start;padding-left:calc(17.2*var(--u));border-radius:calc(6*var(--u))}
.try .split-bridge{width:calc(1.4*var(--u));margin:calc(6*var(--u)) 0 calc(7*var(--u))}
.try .split-icon{width:calc(35.1*var(--u));border-radius:calc(6*var(--u))}
.ico-try{width:calc(15*var(--u))}

.wordmark{position:absolute;right:calc(31*var(--u));bottom:calc(64.5*var(--u));
  width:min(calc(962*var(--u)), calc(100cqw - 480*var(--u)));color:#fff}
.wm-svg{width:100%;height:auto;fill:currentColor}

/* ---------- entrance motion (respecting reduced-motion) ---------- */
@media (prefers-reduced-motion:no-preference){
  .headline span,.demo,.card,.wordmark{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .headline span:nth-child(2){animation-delay:.06s}.demo{animation-delay:.14s}.card{animation-delay:.22s}.wordmark{animation-delay:.3s}
  .hero-bg{animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(calc(18*var(--u)))}}
@keyframes settle{from{transform:scale(1.04)}}
.static *{animation:none!important;transition:none!important}

/* =====================================================================
   PORTRAIT / NARROW — the composition reflows into a vertical stack.
   --m : hero unit, 1px on a 390px-wide phone, capped for tablets.
   --n : nav unit, capped lower so the bar never crowds at tablet widths.
   ===================================================================== */
@media (max-aspect-ratio:23/20){
  :root{--m:clamp(.82px, calc(100vw / 390), 1.6px);--n:clamp(.82px, calc(100vw / 390), 1.3px)}
  .page{gap:calc(8*var(--n));padding:calc(8*var(--n));height:auto;min-height:100vh;min-height:100dvh;
    padding-left:max(calc(8*var(--n)),env(safe-area-inset-left));padding-right:max(calc(8*var(--n)),env(safe-area-inset-right));
    padding-bottom:max(calc(8*var(--n)),env(safe-area-inset-bottom))}

  /* nav */
  .nav{height:calc(56*var(--n));border-radius:calc(10*var(--n))}
  .logo{left:calc(16*var(--n));top:50%;translate:0 -50%}
  .logo-svg{width:calc(112*var(--n))}
  .links a,.headline span,.ico-nav,.ico-demo{translate:none!important}
  .cta{display:none}
  .menu{display:flex;right:calc(8*var(--n));top:calc(8*var(--n));height:calc(40*var(--n));font-size:calc(15*var(--n));line-height:1;font-weight:450;letter-spacing:calc(-.2*var(--n))}
  .menu .split-main{padding:0 calc(14*var(--n));border-radius:calc(6*var(--n));min-width:calc(66*var(--n))}
  .menu .split-bridge{width:calc(2*var(--n));margin:calc(10*var(--n)) 0}
  .menu .split-icon{width:calc(40*var(--n));border-radius:calc(6*var(--n))}
  .menu-ico{width:calc(16*var(--n));overflow:visible}
  .menu-ico path{transition:transform .3s cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:center}
  .nav[data-open="true"] .menu-ico .l1{transform:translateY(3.5px) rotate(45deg)}
  .nav[data-open="true"] .menu-ico .l2{transform:translateY(-3.5px) rotate(-45deg)}

  /* dropdown sheet (glass, same language as the hero card) */
  .links{display:none;position:absolute;left:0;right:0;top:calc(100% + 8*var(--n));transform:none;flex-direction:column;gap:0;
    padding:calc(8*var(--n));border-radius:calc(10*var(--n));background:rgba(243,244,244,.86);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:calc(20*var(--n));letter-spacing:calc(-.4*var(--n))}
  .nav[data-open="true"] .links{display:flex;animation:sheet .28s cubic-bezier(.2,.7,.2,1)}
  .links a{padding:calc(14*var(--n)) calc(10*var(--n));border-bottom:1px solid rgba(0,0,0,.07)}
  .links a.links-cta{display:flex;align-items:center;justify-content:space-between;margin-top:calc(8*var(--n));border:0;border-radius:calc(7*var(--n));
    background:var(--btn);color:var(--btn-ink);font-size:calc(17*var(--n))}
  .ico-sheet{width:calc(17*var(--n))}

  /* hero: top group / flexible image window / bottom group */
  .hero{min-height:min-content;border-radius:calc(10*var(--n));display:flex;flex-direction:column;justify-content:space-between;gap:calc(28*var(--m));
    padding:calc(22*var(--m)) calc(18*var(--m)) calc(18*var(--m));container-type:inline-size}
  .hero-bg{object-position:60% 50%}
  .hero-shade{background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 50%,rgba(0,0,0,.36) 100%)}
  .hero-top,.hero-bottom{position:relative;inset:auto}
  .headline{position:relative;left:auto;top:auto;font-size:calc(38*var(--m));line-height:1.06;letter-spacing:-.031em;white-space:normal;text-wrap:balance}
  .headline span{display:inline;letter-spacing:inherit!important}
  .demo{position:relative;left:auto;top:auto;display:inline-flex;margin-top:calc(26*var(--m));padding-bottom:calc(12*var(--m));font-size:calc(18*var(--m));letter-spacing:-.025em}
  .demo::after{left:0;top:auto;bottom:0;width:100%;height:calc(1.6*var(--m))}
  .ico-demo{width:calc(15*var(--m));margin-left:calc(14*var(--m))}

  .hero-bottom{display:flex;flex-direction:column;gap:calc(18*var(--m))}
  .card{position:relative;left:auto;bottom:auto;width:100%;max-width:calc(400*var(--m));height:auto;display:flex;gap:calc(14*var(--m));
    padding:calc(12*var(--m));border-radius:calc(10*var(--m));
    -webkit-backdrop-filter:blur(calc(22*var(--m))) saturate(2.8) brightness(.95);backdrop-filter:blur(calc(22*var(--m))) saturate(2.8) brightness(.95);box-shadow:inset 0 0 0 1px var(--glass-rim)}
  .thumb{position:relative;left:auto;top:auto;flex:none;width:calc(104*var(--m));height:calc(97*var(--m));border-radius:calc(7*var(--m))}
  .thumb img{left:calc(5.6*var(--m));top:calc(4.4*var(--m));width:calc(93*var(--m))}
  .thumb::before{top:calc(76.6*var(--m));height:calc(11*var(--m))}
  .card-body{position:relative;left:auto;inset:auto;display:flex;flex-direction:column;justify-content:center;gap:calc(6*var(--m));min-width:0}
  .card-title,.card-sub{position:relative;left:auto;top:auto;white-space:normal}
  .card-title{font-size:calc(16.5*var(--m));line-height:1.15;letter-spacing:-.012em}
  .card-sub{font-size:calc(12.5*var(--m));line-height:1.3;letter-spacing:0}
  .try{position:relative;left:auto;top:auto;height:calc(34*var(--m));margin-top:calc(6*var(--m));align-self:flex-start;font-size:calc(14*var(--m))}
  .try .split-main{width:auto;padding:0 calc(16*var(--m));border-radius:calc(6*var(--m))}
  .try .split-bridge{width:calc(1.4*var(--m));margin:calc(6*var(--m)) 0}
  .try .split-icon{width:calc(32*var(--m));border-radius:calc(6*var(--m))}
  .ico-try{width:calc(14*var(--m))}

  .wordmark{position:relative;right:auto;bottom:auto;width:100%}
  @keyframes rise{from{opacity:0;transform:translateY(calc(14*var(--m)))}}
}
/* large portrait (big tablets, vertical monitors): inline nav returns */
@media (max-aspect-ratio:23/20) and (min-width:900px){
  .menu{display:none}
  .cta{display:flex;right:calc(8*var(--n));top:calc(8*var(--n));height:calc(40*var(--n));font-size:calc(14.5*var(--n));padding-top:0}
  .cta .split-main{width:auto;padding:0 calc(16*var(--n));border-radius:calc(6*var(--n))}
  .cta .split-bridge{width:calc(2*var(--n));margin:calc(10*var(--n)) 0}
  .cta .split-icon{width:calc(40*var(--n));border-radius:calc(6*var(--n))}
  .ico-nav{width:calc(14*var(--n))}
  .links,.nav[data-open="true"] .links{display:flex;position:absolute;left:50%;right:auto;top:50%;transform:translate(-50%,-50%);flex-direction:row;
    gap:calc(26*var(--n));padding:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;
    font-size:calc(15.5*var(--n));letter-spacing:calc(-.3*var(--n));animation:none}
  .links a{padding:0;border:0}
  .links a.links-cta{display:none}
  .hero{padding:calc(26*var(--m)) calc(24*var(--m)) calc(22*var(--m))}
  .headline{font-size:calc(44*var(--m))}
}
/* short landscape phones: keep the desktop composition, trim the chrome */
@media (min-aspect-ratio:23/20) and (max-height:500px){
  .page{gap:calc(10*var(--u));padding-top:calc(8*var(--u))}
}
@keyframes sheet{from{opacity:0;transform:translateY(-6px)}}

</style>
</head>
